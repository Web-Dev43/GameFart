<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner — GameFart</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><a class="logo" href="index.html">💨 GameFart</a><nav><a href="index.html#games">Games</a><a href="moderator.html">Moderation</a></nav></header><main><section class="section"><p class="eyebrow">OWNER ONLY</p><h1>GameFart control room</h1><p id="status" class="hero-copy">Checking owner access...</p><div id="panel" class="auth-card" hidden><h2>Moderator management</h2><p>Add or remove moderators. The owner account is protected and cannot be changed from here.</p><form id="mod-form" class="auth-form"><input id="mod-email" type="email" placeholder="Moderator's GameFart account email" required><button type="submit">Add moderator</button></form><div id="mods"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script>
const statusEl=document.querySelector("#status"),panel=document.querySelector("#panel"),form=document.querySelector("#mod-form"),mods=document.querySelector("#mods");
function render(list){mods.replaceChildren();if(!list.length){const p=document.createElement("p");p.className="muted";p.textContent="No moderators yet.";mods.append(p);return}list.forEach(m=>{const row=document.createElement("div");row.className="score-row";const name=document.createElement("b");name.textContent=m.email||m.id;const btn=document.createElement("button");btn.textContent="Remove";btn.className="button secondary";btn.onclick=async()=>{if(!confirm("Remove this moderator?"))return;try{await GameFartAuth.manageModerators("remove",m.email);load()}catch(e){alert(e.message)}};row.append(name,btn);mods.append(row)})}
async function load(){try{const r=await GameFartAuth.listModerators();render(r.moderators||[])}catch(e){statusEl.textContent=e.message}}
(async()=>{const u=await GameFartAuth.getUser();if(!u||!GameFartAuth.isOwner(u)){statusEl.textContent="Owner access denied.";return}statusEl.textContent="Owner access granted.";panel.hidden=false;load()})();
form.onsubmit=async e=>{e.preventDefault();const email=document.querySelector("#mod-email").value.trim();try{await GameFartAuth.manageModerators("add",email);form.reset();load()}catch(err){alert(err.message)}};
</script></body></html>
