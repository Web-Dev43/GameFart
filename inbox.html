<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inbox — GameFart</title><link rel="stylesheet" href="style.css"></head><body><script src="big-fart.js"></script><header class="topbar"><a class="logo" href="index.html">💨 GameFart</a><nav><a href="index.html#games">Games</a><a href="owner.html">Owner Dashboard</a></nav></header><main><section class="section"><p class="eyebrow">YOUR ACCOUNT</p><h1>GameFart Inbox</h1><p id="status" class="hero-copy">Loading your inbox...</p><div id="inbox" class="mod-queue"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script>
const statusEl=document.querySelector("#status"),inbox=document.querySelector("#inbox");
async function load(){try{const u=await GameFartAuth.getUser();if(!u||!GameFartAuth.isOwner(u)){statusEl.textContent="This inbox is only available to the GameFart owner.";return}statusEl.textContent="Moderator applications and account messages.";const {data,error}=await GameFartAuth.client.from("gamefart_moderator_applications").select("id,applicant_email,display_name,experience,reason,status,reviewer_note,created_at,reviewed_at").order("created_at",{ascending:false});if(error)throw error;inbox.replaceChildren();if(!data?.length){const empty=document.createElement("div");empty.className="auth-card";empty.innerHTML="<h2>Inbox empty 💨</h2><p>No moderator applications yet.</p>";inbox.append(empty);return}data.forEach(a=>{const card=document.createElement("article");card.className="mod-card";const info=document.createElement("div"),ey=document.createElement("p"),h=document.createElement("h2"),email=document.createElement("p"),reason=document.createElement("p"),date=document.createElement("small"),actions=document.createElement("div");ey.className="eyebrow";ey.textContent=a.status;h.textContent=a.display_name;email.textContent=a.applicant_email;reason.textContent="Why: "+a.reason;date.textContent=new Date(a.created_at).toLocaleString();info.append(ey,h,email,reason,date);actions.className="mod-actions";const details=document.createElement("details");const summary=document.createElement("summary");summary.textContent="Read application";const exp=document.createElement("p");exp.textContent="Experience: "+a.experience;details.append(summary,exp);if(a.reviewer_note){const note=document.createElement("p");note.textContent="Owner note: "+a.reviewer_note;details.append(note)}actions.append(details);card.append(info,actions);inbox.append(card)})}catch(e){window.showBigFart?.(e,"Loading GameFart inbox")}}load();
</script></body></html>
