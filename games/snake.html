<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snake — GameFart</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0d0d10;color:#f7f7f2;font:16px system-ui;text-align:center;padding:24px}a{color:#b7ff4a;text-decoration:none;font-weight:800}.wrap{max-width:520px;margin:auto}h1{font-size:42px;margin:20px 0 4px}.sub{color:#999;margin:0 0 18px}.hud{display:flex;justify-content:space-between;background:#17171c;border:1px solid #303038;padding:12px 16px;border-radius:12px;margin-bottom:12px;font-weight:800}canvas{width:min(92vw,480px);height:min(92vw,480px);background:#111116;border:1px solid #303038;border-radius:14px;image-rendering:pixelated}.controls{display:grid;grid-template-columns:repeat(3,60px);justify-content:center;gap:8px;margin:16px}.controls button{height:50px;background:#202027;color:white;border:1px solid #3b3b45;border-radius:10px;font-size:20px}.controls .blank{visibility:hidden}.restart{background:#b7ff4a;color:#10140a;border:0;border-radius:10px;padding:11px 16px;font-weight:900}</style></head><body><div class="wrap"><a href="../index.html">← GameFart</a><h1>🐍 Snake</h1><p class="sub">Eat the dots. Don't eat yourself. Simple, allegedly.</p><div class="hud"><span>Score: <b id="score">0</b></span><span>Best: <b id="best">0</b></span></div><canvas id="game" width="400" height="400"></canvas><div class="controls"><span class="blank"></span><button data-dir="up">↑</button><span class="blank"></span><button data-dir="left">←</button><button data-dir="down">↓</button><button data-dir="right">→</button></div><button class="restart" id="restart">Restart</button></div><script>const c=document.querySelector("#game"),x=c.getContext("2d"),scoreEl=document.querySelector("#score"),bestEl=document.querySelector("#best"),N=20,S=20;let snake,food,dir,next,score,best=Number(localStorage.getItem("gf-snake-best")||0),timer,dead;bestEl.textContent=best;function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];food={x:15,y:10};dir={x:1,y:0};next=dir;score=0;dead=false;scoreEl.textContent=0;clearInterval(timer);timer=setInterval(tick,105);draw()}function placeFood(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}function tick(){if(dead)return;dir=next;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(p=>p.x===h.x&&p.y===h.y)){dead=true;clearInterval(timer);return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;localStorage.setItem("gf-snake-best",best)}placeFood()}else snake.pop();draw()}function draw(){x.fillStyle="#111116";x.fillRect(0,0,400,400);x.fillStyle="#b7ff4a";snake.forEach((p,i)=>{x.fillStyle=i?"#7da52f":"#c9ff68";x.fillRect(p.x*S+1,p.y*S+1,S-2,S-2)});x.fillStyle="#ff765c";x.fillRect(food.x*S+3,food.y*S+3,S-6,S-6);if(dead){x.fillStyle="#000b";x.fillRect(0,0,400,400);x.fillStyle="white";x.textAlign="center";x.font="bold 32px system-ui";x.fillText("GAME OVER",200,190);x.font="16px system-ui";x.fillText("Press Restart",200,220)}}function set(d){if(d.x+dir.x!==0||d.y+dir.y!==0)next=d}document.addEventListener("keydown",e=>{const m={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},w:{x:0,y:-1},s:{x:0,y:1},a:{x:-1,y:0},d:{x:1,y:0}};if(m[e.key]){e.preventDefault();set(m[e.key])}});document.querySelectorAll("[data-dir]").forEach(b=>b.onclick=()=>set({up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[b.dataset.dir]));document.querySelector("#restart").onclick=reset;reset();</script></body></html>
