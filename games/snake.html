<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snake — GameFart</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#08090b;color:#f4f1e8;font:16px system-ui;text-align:center;padding:22px}a{color:#ffb84d;text-decoration:none;font-weight:800}.wrap{max-width:560px;margin:auto}h1{font-size:44px;margin:18px 0 2px}.sub{color:#98979a;margin:0 0 18px}.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#101216;border:1px solid #2a2d32;padding:12px 10px;border-radius:14px;margin-bottom:12px;font-weight:800}.hud span{font-size:13px}.world{color:#ffb84d}canvas{width:min(92vw,480px);height:min(92vw,480px);background:#0b0d0f;border:1px solid #2a2d32;border-radius:16px;image-rendering:pixelated}.controls{display:grid;grid-template-columns:repeat(3,60px);justify-content:center;gap:8px;margin:16px}.controls button{height:50px;background:#171a1e;color:white;border:1px solid #343840;border-radius:12px;font-size:20px}.controls .blank{visibility:hidden}.restart{background:#ffb84d;color:#171006;border:0;border-radius:12px;padding:11px 16px;font-weight:900}</style></head><body><div class="wrap"><a href="../index.html">← GameFart</a><h1>🐍 Snake</h1><p class="sub">Go through the wall. Come out the other side. Keep eating.</p><div class="hud"><span>Score: <b id="score">0</b></span><span>Best: <b id="best">0</b></span><span class="world">🌎 World: <b id="world">—</b></span></div><canvas id="game" width="400" height="400"></canvas><div class="controls"><span class="blank"></span><button data-dir="up">↑</button><span class="blank"></span><button data-dir="left">←</button><button data-dir="down">↓</button><button data-dir="right">→</button></div><button class="restart" id="restart">Restart</button></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../scores.js"></script><script>const c=document.querySelector("#game"),x=c.getContext("2d"),scoreEl=document.querySelector("#score"),bestEl=document.querySelector("#best"),worldEl=document.querySelector("#world"),N=20,S=20;let snake,food,dir,next,score,best=Number(localStorage.getItem("gf-snake-best")||0),timer,dead;bestEl.textContent=best;function refreshWorld(){GameFartScores.fillRecord("snake",[worldEl])}function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];placeFood();dir={x:1,y:0};next=dir;score=0;dead=false;scoreEl.textContent=0;clearInterval(timer);timer=setInterval(tick,105);draw();refreshWorld()}function placeFood(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}function tick(){if(dead)return;dir=next;const h={x:(snake[0].x+dir.x+N)%N,y:(snake[0].y+dir.y+N)%N};if(snake.some(p=>p.x===h.x&&p.y===h.y)){dead=true;clearInterval(timer);draw();GameFartScores.submitIfRecord("snake",score).then(refreshWorld);return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;localStorage.setItem("gf-snake-best",best)}placeFood()}else snake.pop();draw()}function draw(){x.fillStyle="#0b0d0f";x.fillRect(0,0,400,400);x.strokeStyle="#15181c";x.lineWidth=1;for(let i=1;i<N;i++){x.beginPath();x.moveTo(i*S,0);x.lineTo(i*S,400);x.stroke();x.beginPath();x.moveTo(0,i*S);x.lineTo(400,i*S);x.stroke()}snake.forEach((p,i)=>{x.fillStyle=i?"#76b83f":"#b9ef62";x.fillRect(p.x*S+2,p.y*S+2,S-4,S-4)});x.fillStyle="#ff715b";x.beginPath();x.arc(food.x*S+10,food.y*S+10,6,0,Math.PI*2);x.fill();if(dead){x.fillStyle="#000b";x.fillRect(0,0,400,400);x.fillStyle="white";x.textAlign="center";x.font="bold 32px system-ui";x.fillText("GAME OVER",200,190);x.font="16px system-ui";x.fillText("Press Restart",200,220)}}function set(d){if(d.x+dir.x!==0||d.y+dir.y!==0)next=d}document.addEventListener("keydown",e=>{const m={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},w:{x:0,y:-1},s:{x:0,y:1},a:{x:-1,y:0},d:{x:1,y:0}};if(m[e.key]){e.preventDefault();set(m[e.key])}});document.querySelectorAll("[data-dir]").forEach(b=>b.onclick=()=>set({up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[b.dataset.dir]));document.querySelector("#restart").onclick=reset;reset();</script></body></html>
