<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game — GameFart</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0b0e;color:#f4f1e8;font:16px system-ui;padding:18px;text-align:center}a{color:#ffb84d;text-decoration:none;font-weight:800}.top{max-width:1000px;margin:auto;text-align:left}.game{max-width:1000px;margin:18px auto 0}.game iframe{width:100%;height:72vh;min-height:520px;border:1px solid #2b2b33;border-radius:16px;background:white}.muted{color:#9a999f}</style></head><body><div class="top"><a href="index.html">← GameFart</a><h1 id="title">Loading...</h1><p id="description" class="muted"></p><p id="bot-info" class="muted"></p></div><main class="game"><iframe id="frame" sandbox="allow-scripts" title="GameFart community game"></iframe></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script>async function load(){const id=new URLSearchParams(location.search).get("id");if(!id){title.textContent="Missing game";return}const {data,error}=await GameFartAuth.publicClient.from("gamefart_games").select("title,description,html,css,javascript,bot_count").eq("id",id).eq("status","published").single();if(error||!data){title.textContent="Game not found";description.textContent="It may still be in moderation, or a moderator yeeted it.";return}title.textContent=data.title;description.textContent=data.description||"";
document.querySelector("#bot-info").textContent=data.bot_count ? "🤖 "+data.bot_count+" bot opponent"+(data.bot_count===1?"":"s")+" may compete in this game." : "";
const frame=document.querySelector("#frame");const botCount=Math.max(0,Math.min(8,Number(data.bot_count)||0));
const botApi=`<script>
window.GameFartBots=(function(){
  const maxBots=${botCount};
  function create(options){
    options=options||{};
    const count=Math.max(0,Math.min(maxBots,Math.floor(Number(options.count)||maxBots)));
    const interval=Math.max(50,Math.min(2000,Math.floor(Number(options.interval)||250)));
    const update=typeof options.update==="function"?options.update:function(){};
    const names=Array.isArray(options.names)?options.names:[];
    const bots=Array.from({length:count},(_,i)=>({id:"bot-"+(i+1),name:String(names[i]||("Bot "+(i+1))).slice(0,24),score:0,state:{}}));
    let timer=setInterval(()=>bots.forEach(bot=>{try{update(bot,bots)}catch(e){console.error("Bot error",e)}}),interval);
    return {bots,stop(){clearInterval(timer);timer=null}};
  }
  return {maxBots,create};
})();
<\\/script>`;
const doc="<!doctype html><html><head><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><style>"+data.css+"</style></head><body>"+data.html+botApi+"<script>"+data.javascript+"<\\/script></body></html>";frame.srcdoc=doc}load();</script></body></html>
