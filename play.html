<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game — GameFart</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0b0e;color:#f4f1e8;font:16px system-ui;padding:18px;text-align:center}a{color:#ffb84d;text-decoration:none;font-weight:800}.top{max-width:1000px;margin:auto;text-align:left}.game{max-width:1000px;margin:18px auto 0}.game iframe{width:100%;height:72vh;min-height:520px;border:1px solid #2b2b33;border-radius:16px;background:white}.muted{color:#9a999f}</style></head><body><script src="big-fart.js"></script><div class="top"><a href="index.html">← GameFart</a><h1 id="title">Loading...</h1><p id="description" class="muted"></p><p id="bot-info" class="muted"></p></div><main class="game"><iframe id="frame" sandbox="allow-scripts" title="GameFart community game"></iframe></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script>async function load(){try{const id=new URLSearchParams(location.search).get("id");if(!id){title.textContent="Missing game";return}const user=await GameFartAuth.getUser();const staff=!!user&&(GameFartAuth.isModerator(user)||GameFartAuth.isOwner(user));const source=staff?GameFartAuth.client:GameFartAuth.publicClient;const query=source.from("gamefart_games").select("title,description,html,css,javascript,bot_count,status").eq("id",id);if(!staff)query.eq("status","published");const {data,error}=await query.single();if(error||!data){title.textContent="Game not found";description.textContent="It may still be in moderation, or a moderator yeeted it.";return}title.textContent=data.title;description.textContent=data.description||"";if(staff&&data.status!=="published")description.textContent=(data.description||"")+" · Staff preview: "+data.status;document.querySelector("#bot-info").textContent=data.bot_count ? "🤖 "+data.bot_count+" bot opponent"+(data.bot_count===1?"":"s")+" may compete in this game." : "";const frame=document.querySelector("#frame");const botCount=Math.max(0,Math.min(8,Number(data.bot_count)||0));const esc=s=>String(s??"").replace(/<\\/script/gi,"<\\/scr"+"ipt");let botScript="";if(botCount){botScript="window.GameFartBots=(function(){const maxBots="+botCount+";function create(options){options=options||{};const requested=options.count===undefined?maxBots:Number(options.count);const count=Math.max(0,Math.min(maxBots,Math.floor(Number.isFinite(requested)?requested:0)));const interval=Math.max(50,Math.min(2000,Math.floor(Number(options.interval)||250)));const update=typeof options.update===\"function\"?options.update:function(){};const names=Array.isArray(options.names)?options.names:[];const bots=Array.from({length:count},(_,i)=>({id:\"bot-\"+(i+1),name:String(names[i]||(\"Bot \"+(i+1))).slice(0,24),score:0,state:{}}));let timer=setInterval(()=>bots.forEach(bot=>{try{update(bot,bots)}catch(e){console.error(\"Bot error\",e)}}),interval);return {bots,stop(){clearInterval(timer);timer=null}}}return {maxBots,create};})();"}const doc="<!doctype html><html><head><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><style>"+esc(data.css)+"</style></head><body>"+data.html+(botScript?("<script>"+esc(botScript)+"</script>"):"")+"<script>"+esc(data.javascript)+"</script></body></html>";frame.srcdoc=doc}catch(e){window.showBigFart?.(e,"Loading community game")}}load();</script></body></html>
