<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game — GameFart</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0b0e;color:#f4f1e8;font:16px system-ui;padding:18px;text-align:center}a{color:#ffb84d;text-decoration:none;font-weight:800}.top{max-width:1000px;margin:auto;text-align:left}.game{max-width:1000px;margin:18px auto 0}.game iframe{width:100%;height:72vh;min-height:520px;border:1px solid #2b2b33;border-radius:16px;background:white}.muted{color:#9a999f}</style></head><body><div class="top"><a href="index.html">← GameFart</a><h1 id="title">Loading...</h1><p id="description" class="muted"></p></div><main class="game"><iframe id="frame" sandbox="allow-scripts" title="GameFart community game"></iframe></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script>async function load(){const id=new URLSearchParams(location.search).get("id");if(!id){title.textContent="Missing game";return}const {data,error}=await GameFartAuth.client.from("gamefart_games").select("title,description,html,css,javascript").eq("id",id).eq("status","published").single();if(error||!data){title.textContent="Game not found";description.textContent="It may still be in moderation, or a moderator yeeted it.";return}title.textContent=data.title;description.textContent=data.description||"";const doc="<!doctype html><html><head><meta name='viewport' content='width=device-width,initial-scale=1'><style>"+data.css+"</style></head><body>"+data.html+"<script>"+data.javascript+"<\/script></body></html>";document.querySelector("#frame").srcdoc=doc}load();</script></body></html>
