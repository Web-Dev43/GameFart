<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moderator — GameFart</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><a class="logo" href="index.html">💨 GameFart</a><nav><a href="index.html#games">Games</a><a href="create.html">Create</a><a href="index.html#scores">World Records</a></nav></header><main><section class="section"><p class="eyebrow">MODERATION</p><h1>Moderator panel</h1><p id="status" class="hero-copy">Checking your badge...</p><div id="queue" class="mod-queue"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script>
const statusEl=document.querySelector("#status"),queue=document.querySelector("#queue");
function makeCard(g){const a=document.createElement("article");a.className="mod-card";a.innerHTML="<div><p class='eyebrow'>"+g.status+"</p><h2>"+g.title+"</h2><p>"+g.description+"</p><small>"+g.slug+"</small></div><div class='mod-actions'></div>";const actions=a.querySelector(".mod-actions");["approve","reject"].forEach(action=>{const b=document.createElement("button");b.textContent=action==="approve"?"Publish":"Reject";b.onclick=async()=>{const note=action==="reject"?(prompt("Reason for rejection?")||"Rejected by moderator."):null;const patch=action==="approve"?{status:"published",moderator_note:null}:{status:"rejected",moderator_note:note};const {error}=await GameFartAuth.client.from("gamefart_games").update(patch).eq("id",g.id);if(error)alert(error.message);else load()};actions.appendChild(b)});const p=document.createElement("a");p.href="play.html?id="+encodeURIComponent(g.id);p.target="_blank";p.textContent="Preview";actions.appendChild(p);return a}
async function load(){const user=await GameFartAuth.getUser();if(!user||!GameFartAuth.isModerator(user)){statusEl.textContent="No moderator badge. This page is not for civilians.";return}statusEl.textContent="Moderator access granted.";const {data,error}=await GameFartAuth.client.from("gamefart_games").select("id,title,slug,description,html,css,javascript,status,created_at,moderator_note").in("status",["pending","rejected"]).order("created_at",{ascending:false});if(error){statusEl.textContent=error.message;return}queue.replaceChildren(...(data||[]).map(makeCard));if(!data?.length)queue.innerHTML="<div class='auth-card'><h2>Queue empty</h2><p>No one is currently making you read their JavaScript. Peace.</p></div>"}
load();
</script></body></html>
