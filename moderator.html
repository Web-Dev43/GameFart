<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moderator — GameFart</title><link rel="stylesheet" href="style.css"></head><body><script src="big-fart.js"></script><header class="topbar"><a class="logo" href="index.html">💨 GameFart</a><nav><a href="index.html#games">Games</a><a href="create.html">Create</a><a href="index.html#scores">World Records</a></nav></header><main><section class="section"><p class="eyebrow">MODERATION</p><h1>Moderator panel</h1><p id="status" class="hero-copy">Checking your badge...</p><div id="queue" class="mod-queue"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script>
const statusEl=document.querySelector("#status"),queue=document.querySelector("#queue");
function makeCard(g){const a=document.createElement("article");a.className="mod-card";const info=document.createElement("div"),ey=document.createElement("p"),h=document.createElement("h2"),d=document.createElement("p"),s=document.createElement("small"),actions=document.createElement("div");ey.className="eyebrow";ey.textContent=g.status;h.textContent=g.title;d.textContent=g.description||"";s.textContent=g.slug;actions.className="mod-actions";info.append(ey,h,d,s);a.appendChild(info);["approve","reject"].forEach(action=>{const b=document.createElement("button");b.textContent=action==="approve"?"Publish":"Reject";b.onclick=async()=>{const note=action==="reject"?(prompt("Reason for rejection?")||"Rejected by moderator."):null;const patch=action==="approve"?{status:"published",moderator_note:null}:{status:"rejected",moderator_note:note};const {error}=await GameFartAuth.client.from("gamefart_games").update(patch).eq("id",g.id);if(error)alert(error.message);else load()};actions.appendChild(b)});const p=document.createElement("a");p.href="play.html?id="+encodeURIComponent(g.id);p.target="_blank";p.textContent="Preview";actions.appendChild(p);a.appendChild(actions);return a}
async function load(){const user=await GameFartAuth.getUser();if(!user||(!GameFartAuth.isModerator(user)&&!GameFartAuth.isOwner(user))){statusEl.textContent="No staff badge. This page is not for civilians.";return}statusEl.textContent=GameFartAuth.isOwner(user)?"Owner moderation access granted.":"Moderator access granted.";const {data,error}=await GameFartAuth.client.from("gamefart_games").select("id,title,slug,description,status,created_at,moderator_note").in("status",["pending","rejected"]).order("created_at",{ascending:false});if(error){statusEl.textContent=error.message;return}queue.replaceChildren(...(data||[]).map(makeCard));if(!data?.length){const empty=document.createElement("div");empty.className="auth-card";empty.innerHTML="<h2>Queue empty</h2><p>No one is currently making you read their JavaScript. Peace.</p>";queue.appendChild(empty)}}load();
</script></body></html>
